const KEY = "attn_label_v1";
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e) { mem[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e) { delete mem[k]; } }
};
const saved = JSON.parse(store.get(KEY) || "{}");
const LABEL = {single:"单峰", double:"双峰", plateau:"平台"};

function render() {
  const rows = DATA.filter(d => d.need);
  document.getElementById("rows").innerHTML = rows.map(d => `
    <div class="card" id="card-${d.id}">
      <div class="meta"><b>#${d.id}</b> · ${d.start} → ${d.end} · ${d.days} 天</div>
      <img src="${d.img}" alt="#${d.id}">
      <div class="badges">
        <span class="b br">规则：${LABEL[d.rule]}</span>
        <span class="b bl">初标：${LABEL[d.llm]}</span>
      </div>
      <select data-id="${d.id}">
        <option value="">— 请选择 —</option>
        <option value="single">单峰</option>
        <option value="double">双峰</option>
        <option value="plateau">平台</option>
      </select>
    </div>`).join("");
  rows.forEach(d => {
    const sel = document.querySelector(`select[data-id="${d.id}"]`);
    if (saved[d.id]) sel.value = saved[d.id];
    sel.addEventListener("change", () => {
      saved[d.id] = sel.value;
      store.set(KEY, JSON.stringify(saved));
      sel.closest(".card").classList.toggle("done", !!sel.value);
      update();
    });
    sel.closest(".card").classList.toggle("done", !!sel.value);
  });
  update();
}
function update() {
  const rows = DATA.filter(d => d.need);
  const n = rows.filter(d => saved[d.id]).length;
  document.getElementById("done").textContent = n;
}
document.getElementById("clear").onclick = () => {
  if (!confirm("清空所有选择？")) return;
  store.del(KEY);
  for (const k in saved) delete saved[k];
  document.querySelectorAll("select").forEach(s => { s.value = ""; s.closest(".card").classList.remove("done"); });
  update();
};

  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "episodes_labeled.csv";
  a.click();
};
document.getElementById("import").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const lines = r.result.replace(/^\ufeff/, "").split(/\r?\n/).filter(x => x.trim());
    let n = 0;
    for (let i = 1; i < lines.length; i++) {
      const p = lines[i].split(",");
      const id = (p[0] || "").trim(), lab = (p[1] || "").trim();
      if (id && LABEL[lab]) { saved[id] = lab; n++; }
    }
    store.set(KEY, JSON.stringify(saved));
    render();
    alert("已导入 " + n + " 条");
  };
  r.readAsText(f);
  ev.target.value = "";
};
render();
</script></body></html>
