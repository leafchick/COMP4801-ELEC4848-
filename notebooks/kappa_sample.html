const KEY = "attn_kappa_v1";
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e) { mem[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e) { delete mem[k]; } }
};
const saved = JSON.parse(store.get(KEY) || "{}");
const LABEL = {single:"单峰", multi:"非单峰"};
function render() {
  document.getElementById("rows").innerHTML = DATA.map(d => `
    <div class="card${saved[d.id] ? " done" : ""}" id="card-${d.id}">
      <div class="meta"><b>#${d.id}</b> · ${d.start} → ${d.end} · ${d.days} 天</div>
      <img src="${d.img}" alt="#${d.id}">
      <select data-id="${d.id}">
        <option value="">— 请选择 —</option>
        <option value="single">单峰</option>
        <option value="multi">非单峰</option>
      </select>
    </div>`).join("");
  DATA.forEach(d => {
    const sel = document.querySelector(`select[data-id="${d.id}"]`);
    sel.value = saved[d.id] || "";
    sel.addEventListener("change", () => {
      if (sel.value) saved[d.id] = sel.value; else delete saved[d.id];
      store.set(KEY, JSON.stringify(saved));
      sel.closest(".card").classList.toggle("done", !!sel.value);
      document.getElementById("done").textContent = Object.keys(saved).filter(k => LABEL[saved[k]]).length;
    });
  });
  document.getElementById("done").textContent = Object.keys(saved).filter(k => LABEL[saved[k]]).length;
}
document.getElementById("clear").onclick = () => {
  if (!confirm("清空全部选择？")) return;
  store.del(KEY); for (const k in saved) delete saved[k];
  document.querySelectorAll("select").forEach(s => { s.value = ""; s.closest(".card").classList.remove("done"); });
  document.getElementById("done").textContent = "0";
};
document.getElementById("export").onclick = () => {
  const n = Object.keys(saved).filter(k => LABEL[saved[k]]).length;
  if (n < 100 && !confirm(`已填 ${n} / 100，仍然导出？`)) return;
  const out = [["episode_id","shape_final"]];
  DATA.forEach(d => out.push([d.id, saved[d.id] || ""]));
  const csv = out.map(r => r.join(",")).join("\n");
  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "review_sample.csv";
  a.click();
};
render();
</script></body></html>
